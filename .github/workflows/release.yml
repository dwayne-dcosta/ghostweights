name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Cross-compile binaries
        run: |
          mkdir -p dist
          GOOS=darwin GOARCH=arm64 go build -o dist/ghostweights-darwin-arm64 ./cli
          GOOS=darwin GOARCH=amd64 go build -o dist/ghostweights-darwin-amd64 ./cli
          GOOS=linux GOARCH=amd64 go build -o dist/ghostweights-linux-amd64 ./cli
          GOOS=linux GOARCH=arm64 go build -o dist/ghostweights-linux-arm64 ./cli
          GOOS=windows GOARCH=amd64 go build -o dist/ghostweights-windows-amd64.exe ./cli

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
